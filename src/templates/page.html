<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  $robots
  <title>$title</title>
  <link rel="stylesheet" href="${base}assets/styles.css">
  <script src="${base}assets/main.js" defer></script>
  <script src="${base}assets/citation-overlay.js" defer></script>
  <script src="${base}assets/tables.js" defer></script>
</head>
<body>
  <!-- Generated by scripts/build.py. Edit src/ files, then rebuild. -->
  <a class="skip-link" href="#main">Skip to content</a>
$navigation
  <main id="main" class="$page_class">
    <div class="page-banner" aria-hidden="true"></div>
$content
$page_navigation
  </main>
  <dialog class="citation-dialog" aria-labelledby="citation-dialog-title">
    <div class="citation-sheet">
      <div class="citation-sheet-header">
        <h2 id="citation-dialog-title">Reference</h2>
        <button type="button" class="citation-close" aria-label="Close citation" autofocus>×</button>
      </div>
      <p class="citation-sheet-content"></p>
      <a class="citation-full-reference">View in references →</a>
    </div>
  </dialog>
$citation_templates
</body>
</html>
